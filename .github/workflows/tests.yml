name: Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go mod tidy

      - name: Start server
        run: |
          set -e
          go run main.go &
          # Ждём, пока сервер ответит
          for i in {1..30}; do
            if curl -s http://localhost:7540 >/dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done

      - name: Run all tests
        run: go test -v ./tests